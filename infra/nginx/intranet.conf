# Nginx vor PHP-FPM. Steht selbst hinter Traefik, deshalb keine TLS-Behandlung
# und keine Umleitung auf HTTPS an dieser Stelle.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Muss ueber der Grenze der Anwendung liegen (config/documents.php,
    # max_size_kb = 51200, also 50 MiB) und zu post_max_size in
    # infra/php/intranet.ini passen. Ist dieser Wert kleiner, lehnt Nginx die
    # Datei ab, bevor die Anwendung eine verstaendliche Meldung erzeugen kann.
    client_max_body_size 72M;

    server_tokens off;

    # Die Weiterleitungs-Kopfzeilen wertet ausschliesslich Laravel aus
    # (trustProxies in bootstrap/app.php). Nginx darf REMOTE_ADDR deshalb
    # NICHT ersetzen: Laravel prueft, ob die Gegenstelle ein anerkannter Proxy
    # ist, und wuerde bei einer ersetzten Adresse aus dem Internet die
    # Kopfzeilen verwerfen. Damit waeren Protokollerkennung, Anmeldeverlauf
    # und Begrenzung der Anfragen falsch.

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Stilvorlagen und Skripte tragen keinen Inhaltsstempel im Namen. Eine
    # lange, unveraenderliche Zwischenspeicherung wuerde nach einer Lieferung
    # den alten Stand zeigen, bis der Browser von sich aus neu laedt.
    location ~* \.(?:css|js|map)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Schriften und Bilder aendern sich nur mit einem neuen Dateinamen.
    location ~* \.(?:woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        # Ueber eine Variable, damit der Name bei jeder Anfrage neu aufgeloest
        # wird. Ohne das behaelt Nginx die beim Start ermittelte Adresse und
        # antwortet nach einem Neuaufbau des app-Containers mit 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fpm_upstream app:9000;

        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # Kein direkter Aufruf anderer PHP-Dateien.
    location ~ \.php$ {
        return 404;
    }

    # Versteckte Dateien und Ablagen bleiben verschlossen.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
