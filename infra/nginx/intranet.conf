# Nginx vor PHP-FPM. Steht selbst hinter Traefik, deshalb keine TLS-Behandlung
# und keine Umleitung auf HTTPS an dieser Stelle.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 36M;

    # Traefik setzt die Weiterleitungs-Kopfzeilen. Laravel erkennt sie ueber
    # trustProxies in bootstrap/app.php.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Statische Dateien liegen im web-Abbild und werden direkt ausgeliefert.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        # Dienstname aus infra/compose.yaml.
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # Kein direkter Aufruf anderer PHP-Dateien.
    location ~ \.php$ {
        return 404;
    }

    # Versteckte Dateien und Ablagen bleiben verschlossen.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
