; Ergaenzung der Vorgaben des Grundabbilds fuer den Prozesspool von PHP-FPM.
; Wird als /usr/local/etc/php-fpm.d/zz-intranet.conf eingebunden und damit
; nach zz-docker.conf gelesen; spaetere Angaben gewinnen.

[www]
; Umgebungsvariablen der Container an die Arbeitsprozesse weiterreichen.
; Ohne diese Zeile sieht PHP die Werte aus docker compose nicht. Die
; Anwendung liest ihre Konfiguration zwar aus dem Zwischenspeicher, der beim
; Start erzeugt wird, doch soll der Weg nicht von dieser einen Eigenheit
; abhaengen.
clear_env = no

; Ausgaben der Arbeitsprozesse in das Containerprotokoll.
catch_workers_output = yes
decorate_workers_output = no

; Prozessverwaltung. Der Server teilt sich die Kerne mit dem CRM, deshalb eine
; begrenzte Zahl gleichzeitiger Anfragen. Bei Bedarf hier erhoehen und die
; Zahl der Datenbankverbindungen (DB_MAX_CONNECTIONS) mitziehen.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Ein Arbeitsprozess, der laenger braucht als max_execution_time, wird
; abgeraeumt. Ohne diese Angabe kann ein haengender Prozess einen der
; begrenzten Plaetze dauerhaft belegen.
request_terminate_timeout = 130s
