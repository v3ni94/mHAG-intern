; Produktionseinstellungen fuer PHP 8.4 im Container.
; Wird als /usr/local/etc/php/conf.d/zz-intranet.ini eingebunden und
; ueberschreibt damit die Vorgaben des Grundabbilds.

expose_php = Off
date.timezone = Europe/Berlin

; Fehler gehen in den Containerausgang (docker logs), nie an den Browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 512M
max_execution_time = 120

; Dokumente und Anlagen. Beide Werte muessen zur Nginx-Vorgabe
; client_max_body_size passen.
upload_max_filesize = 32M
post_max_size = 36M

; Sitzungen liegen in der Datenbank (SESSION_DRIVER=database), die
; PHP-eigene Sitzungsverwaltung wird nicht verwendet.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Bytecode-Zwischenspeicher. Der Code im Abbild aendert sich zur Laufzeit
; nicht, deshalb wird die Zeitstempelpruefung abgeschaltet.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.jit = disable
