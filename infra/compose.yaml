# Grundstapel des Mueller Holding AG Intranets.
# Allein verwendbar fuer einen Testlauf; fuer den Betrieb hinter Traefik
# zusaetzlich infra/compose.prod.yaml verwenden.
#
# Aufruf aus dem Wurzelverzeichnis des Projekts:
#   docker compose -p mhag-intranet --env-file .env.prod \
#     -f infra/compose.yaml -f infra/compose.prod.yaml up -d
#
# Relative Pfade in dieser Datei beziehen sich auf das Verzeichnis infra/.
name: mhag-intranet

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

# Umgebung der Anwendung. Bewusst vollstaendig aufgefuehrt: nur diese Werte
# erreichen die Container, nichts aus der Umgebung der Kommandozeile.
x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Mueller Holding AG Intranet}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?APP_KEY muss gesetzt sein (php artisan key:generate --show)}
  APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?APP_URL muss gesetzt sein}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
  APP_LOCALE: ${APP_LOCALE:-de}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-de}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-de_DE}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

  # Im Container gehen die Protokolle an die Standardfehlerausgabe und sind
  # damit ueber docker logs und den Protokolldienst des Servers erreichbar.
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_STACK: ${LOG_STACK:-daily}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}

  DB_CONNECTION: ${DB_CONNECTION:-mariadb}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-mhag_intranet}
  DB_USERNAME: ${DB_USERNAME:-mhag_intranet}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}

  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-60}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
  SESSION_PATH: ${SESSION_PATH:-/}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-intern.mueller-holding.ag}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}

  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  CACHE_STORE: ${CACHE_STORE:-database}

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-kontakt@mueller-holding.ag}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Mueller Holding AG}

  DOCUMENT_DISK: ${DOCUMENT_DISK:-local}
  SFTP_HOST: ${SFTP_HOST:-}
  SFTP_PORT: ${SFTP_PORT:-22}
  SFTP_USERNAME: ${SFTP_USERNAME:-}
  SFTP_PRIVATE_KEY: ${SFTP_PRIVATE_KEY:-}
  SFTP_PASSPHRASE: ${SFTP_PASSPHRASE:-}
  SFTP_PASSWORD: ${SFTP_PASSWORD:-}
  SFTP_ROOT_PATH: ${SFTP_ROOT_PATH:-/mueller-holding}
  SFTP_TIMEOUT: ${SFTP_TIMEOUT:-15}
  SFTP_HOST_FINGERPRINT: ${SFTP_HOST_FINGERPRINT:-}

  SIGNATURE_PROVIDER: ${SIGNATURE_PROVIDER:-manual}
  DOCUSIGN_BASE_URL: ${DOCUSIGN_BASE_URL:-}
  DOCUSIGN_ACCOUNT_ID: ${DOCUSIGN_ACCOUNT_ID:-}
  DOCUSIGN_USER_ID: ${DOCUSIGN_USER_ID:-}
  DOCUSIGN_INTEGRATION_KEY: ${DOCUSIGN_INTEGRATION_KEY:-}
  DOCUSIGN_PRIVATE_KEY: ${DOCUSIGN_PRIVATE_KEY:-}
  DOCUSIGN_OAUTH_HOST: ${DOCUSIGN_OAUTH_HOST:-account-d.docusign.com}
  DOCUSIGN_WEBHOOK_SECRET: ${DOCUSIGN_WEBHOOK_SECRET:-}
  DOCUSIGN_EMAIL_SUBJECT: ${DOCUSIGN_EMAIL_SUBJECT:-Dokument zur Unterschrift, Mueller Holding AG}
  DOCUSIGN_TIMEOUT: ${DOCUSIGN_TIMEOUT:-20}
  DOCUSIGN_ANCHOR_STRING: ${DOCUSIGN_ANCHOR_STRING:-Unterschrift}

  BACKUP_PATH: ${BACKUP_PATH:-storage/backups}

x-app-image: &app-image
  image: ${INTRANET_IMAGE_REGISTRY:-local}/mhag-intranet-app:${INTRANET_IMAGE_TAG:?INTRANET_IMAGE_TAG muss gesetzt sein}

# Nur die Verzeichnisse, die Daten enthalten, liegen in einem Volume.
# storage/framework und storage/logs bleiben bewusst im Container: die
# uebersetzten Blade-Vorlagen werden beim Start jedes Containers neu erzeugt,
# ein gemeinsames Volume wuerde den laufenden app-Container beim Start des
# scheduler-Containers mitten im Betrieb treffen.
x-app-volumes: &app-volumes
  - dokumente:/var/www/html/storage/app
  - sicherungen:/var/www/html/storage/backups

x-php: &php
  <<: [*hardening, *app-image]
  environment:
    <<: *app-env
  volumes: *app-volumes
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    <<: *hardening
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${DB_INNODB_BUFFER_POOL_SIZE:-1G}
      - --max-connections=${DB_MAX_CONNECTIONS:-200}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD muss gesetzt sein}
      MARIADB_DATABASE: ${DB_DATABASE:-mhag_intranet}
      MARIADB_USER: ${DB_USERNAME:-mhag_intranet}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Einmaliger Lauf vor dem Start der uebrigen Dienste. Laeuft die Migration
  # auf einen Fehler, startet die Anwendung nicht mit halbem Schema.
  migrate:
    <<: [*hardening, *app-image]
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      <<: *app-env
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *php
    command: ["php-fpm"]
    expose:
      - "9000"

  # Ersetzt den Cron-Eintrag des Webspace. Prueft jede Minute, welche
  # Aufgaben aus routes/console.php faellig sind.
  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  web:
    <<: *hardening
    image: ${INTRANET_IMAGE_REGISTRY:-local}/mhag-intranet-web:${INTRANET_IMAGE_TAG:?INTRANET_IMAGE_TAG muss gesetzt sein}
    depends_on:
      app:
        condition: service_started

volumes:
  db-data:
  dokumente:
  sicherungen:
